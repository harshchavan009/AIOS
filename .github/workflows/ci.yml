name: AIOS Continuous Integration (CI)

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test-backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: aios_user
          POSTGRES_PASSWORD: aios_secure_pass_2026
          POSTGRES_DB: aios_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest pytest-asyncio pytest-cov aiosqlite

      - name: Run Backend Test Suite
        env:
          ENVIRONMENT: testing
          DATABASE_URL: postgresql+asyncpg://aios_user:aios_secure_pass_2026@localhost:5432/aios_db
          REDIS_URL: redis://localhost:6379/0
          PYTHONPATH: .
        run: |
          cd backend
          python -m pip list
          python -m pytest -v 2>&1 | tee /tmp/pytest.log || {
            ERR=$(head -n 25 /tmp/pytest.log | tr '\n' ' ')
            echo "::error title=Pytest Error::$ERR"
            exit 1
          }

  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies & Build Vite Bundle
        run: |
          cd frontend
          npm ci
          npm run build

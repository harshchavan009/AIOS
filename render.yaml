services:
  # ── AIOS FastAPI Backend Web Service ──────────────────────────────────────────
  - type: web
    name: aios-backend
    runtime: python
    rootDir: backend
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: aios-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: aios-redis
          property: connectionString
      - key: FRONTEND_URL
        value: https://aios-opal.vercel.app
      - key: BACKEND_CORS_ORIGINS
        value: "https://aios-opal.vercel.app,http://localhost:5173"
      # AI Model Providers (Enter keys in Render Dashboard)
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: TOGETHER_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      # External Vector & Knowledge Graph DBs (Optional Cloud endpoints)
      - key: NEO4J_URI
        sync: false
      - key: NEO4J_USER
        sync: false
      - key: NEO4J_PASSWORD
        sync: false
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false

  # ── AIOS Redis Managed Service ─────────────────────────────────────────────
  - type: redis
    name: aios-redis
    plan: free
    region: oregon
    ipAllowList: [] # Private network internal access only
    maxmemoryPolicy: allkeys-lru

# ── AIOS Managed PostgreSQL Database ─────────────────────────────────────────
databases:
  - name: aios-db
    plan: free
    region: oregon
    databaseName: aios_db
    user: aios_user
